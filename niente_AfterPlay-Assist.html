<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR2E セッション入力補助</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #222831;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #2f6fed;
      --accent-dark: #2458bd;
      --danger: #b42318;
      --danger-bg: #fff4f2;
      --ok-bg: #f0f7ff;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .mode-button {
      color: var(--text);
      background: #fff;
      border-color: var(--line);
    }

    .mode-button.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    section {
      margin-top: 20px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 11px;
      color: var(--text);
      background: #fff;
      font: inherit;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(47, 111, 237, 0.16);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .session-fields {
      display: grid;
      gap: 14px;
    }

    .input-with-button {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: start;
    }

    .field {
      margin-bottom: 16px;
    }

    .url-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition:
        background-color 120ms ease,
        border-color 120ms ease,
        color 120ms ease,
        box-shadow 120ms ease,
        transform 80ms ease;
    }

    button.primary {
      color: #fff;
      background: var(--accent);
    }

    button.primary:hover {
      background: var(--accent-dark);
      box-shadow: 0 3px 10px rgba(47, 111, 237, 0.22);
    }

    button.secondary {
      color: var(--text);
      background: #fff;
      border-color: var(--line);
    }

    button.secondary:hover {
      border-color: #aab4c3;
      background: #f9fafc;
      box-shadow: 0 2px 8px rgba(34, 40, 49, 0.08);
    }

    button.danger {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: #ffd7d2;
    }

    button.danger:hover {
      color: #912018;
      background: #ffe9e5;
      border-color: #ffb8ae;
      box-shadow: 0 2px 8px rgba(180, 35, 24, 0.12);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      box-shadow: none;
      transform: none;
    }

    .output {
      min-height: 64px;
      padding: 14px;
      border-radius: 6px;
      border: 1px solid #c7ddff;
      background: var(--ok-bg);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .status {
      margin-top: 12px;
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--danger);
    }

    .sheet-result {
      min-height: 26px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .sheet-result.loaded {
      color: var(--text);
      font-weight: 700;
    }

    .sheet-result.error {
      color: var(--danger);
      font-weight: 700;
    }

    .sheet-result-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .guild-toggle {
      min-height: 28px;
      padding: 3px 10px;
      color: var(--muted);
      background: #fff;
      border-color: var(--line);
      font-size: 13px;
    }

    .guild-toggle.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .guild-toggle:not(:disabled):hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #f0f7ff;
    }

    .guild-toggle.active:not(:disabled):hover {
      color: #fff;
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .guild-payment {
      margin: 0;
    }

    .guild-payment input {
      width: 90px;
      margin-left: 6px;
    }

    body.mode-pl .gm-only,
    body.mode-integrated .gm-save-only,
    body.mode-bulk .gm-save-only,
    body.mode-bulk .individual-output,
    body:not(.mode-bulk) .bulk-only {
      display: none;
    }

    body.mode-gm .pl-only {
      display: none;
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 24px, 920px);
        padding-top: 20px;
      }

      section {
        padding: 18px;
      }

      .grid,
      .input-with-button,
      .url-row {
        grid-template-columns: 1fr;
      }

      .url-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body class="mode-gm">
  <main>
    <h1>AR2E セッション入力補助</h1>

    <div class="mode-switch" aria-label="使用モード">
      <button class="mode-button active" type="button" id="gmModeButton" aria-pressed="true">GM用</button>
      <button class="mode-button" type="button" id="plModeButton" aria-pressed="false">PL用</button>
      <button class="mode-button" type="button" id="integratedModeButton" aria-pressed="false">統合</button>
      <button class="mode-button" type="button" id="bulkModeButton" aria-pressed="false">一括</button>
    </div>


    <section aria-labelledby="players-heading">
      <h2 id="players-heading">PCのゆとシートURL</h2>
      <div id="urlList"></div>
      <div class="actions">
        <button class="primary" type="button" id="loadSheetsInline">読み込み</button>
        <button class="secondary" type="button" id="addUrl">URLを追加</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>



    <section aria-labelledby="session-heading">
      <h2 id="session-heading">セッション情報</h2>
      <div class="session-fields">
        <div>
          <label for="sessionDate">日付</label>
          <div class="input-with-button">
            <input id="sessionDate" type="text" inputmode="numeric">
            <button class="secondary copy-session-field" type="button" data-copy-target="sessionDate">コピー</button>
          </div>
        </div>
        <div>
          <label for="scenarioTitle">シナリオタイトル</label>
          <div class="input-with-button">
            <input id="scenarioTitle" type="text">
            <button class="secondary copy-session-field" type="button" data-copy-target="scenarioTitle">コピー</button>
          </div>
        </div>
        <div>
          <label for="growthPoint">成長点</label>
          <div class="input-with-button">
            <input id="growthPoint" type="number" min="0" inputmode="numeric">
            <button class="secondary copy-session-field" type="button" data-copy-target="growthPoint">コピー</button>
          </div>
        </div>
        <div>
          <label for="gold">ゴールド</label>
          <div class="input-with-button">
            <input id="gold" type="number" min="0" inputmode="numeric">
            <button class="secondary copy-session-field" type="button" data-copy-target="gold">コピー</button>
          </div>
        </div>
        <div>
          <label for="gmName">GM名</label>
          <div class="input-with-button">
            <input id="gmName" type="text" autocomplete="name">
            <button class="secondary gm-only gm-save-only" type="button" id="saveGmName">保存</button>
            <button class="secondary copy-session-field" type="button" data-copy-target="gmName">コピー</button>
          </div>
        </div>
      </div>
      <p class="status" id="sessionStatus" aria-live="polite"></p>
    </section>

    <section class="individual-output" aria-labelledby="output-heading">
      <h2 id="output-heading">参加者</h2>
      <div class="output" id="output"></div>
      <div class="actions">
        <button class="primary" type="button" id="loadSheets">読み込んで出力</button>
        <button class="secondary" type="button" id="copyOutput">コピー</button>
      </div>
    </section>

    <section class="pl-only individual-output" aria-labelledby="guild-output-heading">
      <h2 id="guild-output-heading">ギルド出力（保管所）</h2>
      <div class="output" id="guildOutput"></div>
      <div class="actions">
        <button class="secondary" type="button" id="copyGuildOutput">コピー</button>
      </div>
    </section>

    <section class="pl-only individual-output" aria-labelledby="guild-ytsheet-output-heading">
      <h2 id="guild-ytsheet-output-heading">ギルド出力（ゆとシート）</h2>
      <div class="session-fields" id="guildYtsheetOutput">
        <div>
          <label for="guildYtsheetDate">日付</label>
          <div class="input-with-button">
            <input id="guildYtsheetDate" type="text" data-guild-field="date" readonly>
            <button class="secondary copy-session-field" type="button" data-copy-target="guildYtsheetDate">コピー</button>
          </div>
        </div>
        <div>
          <label for="guildYtsheetTitle">タイトル</label>
          <div class="input-with-button">
            <input id="guildYtsheetTitle" type="text" data-guild-field="title" readonly>
            <button class="secondary copy-session-field" type="button" data-copy-target="guildYtsheetTitle">コピー</button>
          </div>
        </div>
        <div>
          <label for="guildYtsheetGrowthPoint">成長点</label>
          <div class="input-with-button">
            <input id="guildYtsheetGrowthPoint" type="text" data-guild-field="growthPoint" readonly>
            <button class="secondary copy-session-field" type="button" data-copy-target="guildYtsheetGrowthPoint">コピー</button>
          </div>
        </div>
        <div>
          <label for="guildYtsheetGm">GM</label>
          <div class="input-with-button">
            <input id="guildYtsheetGm" type="text" data-guild-field="gmName" readonly>
            <button class="secondary copy-session-field" type="button" data-copy-target="guildYtsheetGm">コピー</button>
          </div>
        </div>
        <div>
          <label for="guildYtsheetParticipants">参加者</label>
          <div class="input-with-button">
            <textarea id="guildYtsheetParticipants" data-guild-field="participants" readonly></textarea>
            <button class="secondary copy-session-field" type="button" data-copy-target="guildYtsheetParticipants">コピー</button>
          </div>
        </div>
        <div>
          <label for="guildYtsheetNote">補足</label>
          <div class="input-with-button">
            <textarea id="guildYtsheetNote" data-guild-field="note" readonly></textarea>
            <button class="secondary copy-session-field" type="button" data-copy-target="guildYtsheetNote">コピー</button>
          </div>
        </div>
      </div>
    </section>

    <section class="gm-only individual-output" aria-labelledby="rich-output-heading">
      <h2 id="rich-output-heading">リッチな出力</h2>
      <div class="output" id="richOutput"></div>
      <div class="actions">
        <button class="secondary" type="button" id="copyRichOutput">コピー</button>
      </div>
    </section>

    <section class="gm-only individual-output" aria-labelledby="log-output-heading">
      <h2 id="log-output-heading">ログ集積所</h2>
      <div class="output" id="logOutput"></div>
      <div class="actions">
        <button class="secondary" type="button" id="copyLogOutput">コピー</button>
      </div>
    </section>

    <section class="bulk-only" id="bulkJsonSection" aria-labelledby="bulk-json-heading" hidden>
      <h2 id="bulk-json-heading">JSON</h2>
      <p>「ギルド」を選択したPCから、履歴を追加するPCを選んでください。所属ギルドも自動で読み込みます。</p>
      <div class="actions" id="bulkJsonCandidates"></div>
      <p class="status" id="bulkJsonStatus" aria-live="polite"></p>
      <div class="output" id="bulkJsonPreview" hidden></div>
      <div class="actions">
        <button class="secondary" type="button" id="copyBulkPcJson" disabled>PCのJSONをコピー</button>
        <button class="secondary" type="button" id="copyBulkGuildJson" disabled>ギルドのJSONをコピー</button>
      </div>
      <p>各シートの編集画面で「別のデータを開く」からコピーしたJSONを取り込み、内容を確認して保存してください。</p>
    </section>
  </main>

  <script>
    const urlList = document.querySelector("#urlList");
    const status = document.querySelector("#status");
    const sessionStatus = document.querySelector("#sessionStatus");
    const output = document.querySelector("#output");
    const guildOutput = document.querySelector("#guildOutput");
    const guildYtsheetFields = document.querySelectorAll("#guildYtsheetOutput [data-guild-field]");
    const richOutput = document.querySelector("#richOutput");
    const logOutput = document.querySelector("#logOutput");
    const addUrlButton = document.querySelector("#addUrl");
    const loadSheetsButton = document.querySelector("#loadSheets");
    const loadSheetsInlineButton = document.querySelector("#loadSheetsInline");
    const copyOutputButton = document.querySelector("#copyOutput");
    const copyGuildOutputButton = document.querySelector("#copyGuildOutput");
    const copyRichOutputButton = document.querySelector("#copyRichOutput");
    const copyLogOutputButton = document.querySelector("#copyLogOutput");
    const gmModeButton = document.querySelector("#gmModeButton");
    const plModeButton = document.querySelector("#plModeButton");
    const integratedModeButton = document.querySelector("#integratedModeButton");
    const bulkModeButton = document.querySelector("#bulkModeButton");
    const bulkJsonSection = document.querySelector("#bulkJsonSection");
    const bulkJsonCandidates = document.querySelector("#bulkJsonCandidates");
    const bulkJsonStatus = document.querySelector("#bulkJsonStatus");
    const bulkJsonPreview = document.querySelector("#bulkJsonPreview");
    const copyBulkPcJsonButton = document.querySelector("#copyBulkPcJson");
    const copyBulkGuildJsonButton = document.querySelector("#copyBulkGuildJson");
    const saveGmNameButton = document.querySelector("#saveGmName");
    const copySessionFieldButtons = document.querySelectorAll(".copy-session-field");
    const scenarioTitleInput = document.querySelector("#scenarioTitle");
    const sessionDateInput = document.querySelector("#sessionDate");
    const gmNameInput = document.querySelector("#gmName");
    const growthPointInput = document.querySelector("#growthPoint");
    const goldInput = document.querySelector("#gold");
    let urlRowCount = 0;
    let sessionInfo = {};
    let currentMode = "gm";
    let loadedSheets = [];
    let bulkSource = null;
    let bulkRequestId = 0;
    let bulkPcJson = "";
    let bulkGuildJson = "";
    const modeGmNames = {
      gm: "",
      pl: "",
      integrated: "",
      bulk: "",
    };
    const savedGmNameKey = "trpgSessionTool.gmName";

    function getJapanDateString() {
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).format(new Date());
    }

    function loadSavedGmName() {
      try {
        return localStorage.getItem(savedGmNameKey) || "";
      } catch (error) {
        return "";
      }
    }

    function saveGmName() {
      const gmName = gmNameInput.value.trim();
      if (!gmName) {
        sessionStatus.className = "status error";
        sessionStatus.textContent = "保存するGM名を入力してください。";
        return;
      }

      const savedGmName = loadSavedGmName();
      if (savedGmName && savedGmName !== gmName && !confirm("保存するGM名を上書きしますか？")) {
        return;
      }

      try {
        localStorage.setItem(savedGmNameKey, gmName);
        modeGmNames.gm = gmName;
        sessionStatus.className = "status";
        sessionStatus.textContent = "GM名を保存しました。";
      } catch (error) {
        sessionStatus.className = "status error";
        sessionStatus.textContent = "GM名を保存できませんでした。";
      }
    }

    function saveSessionInfo() {
      sessionInfo = {
        mode: currentMode,
        scenarioTitle: scenarioTitleInput.value.trim(),
        date: sessionDateInput.value.trim(),
        gmName: gmNameInput.value.trim(),
        growthPoint: growthPointInput.value,
        gold: goldInput.value,
      };
      updateGuildOutput();
      updateRichOutput();
      updateLogOutput();
      return sessionInfo;
    }

    function buildParticipantOutput(sheets) {
      return sheets
        .map((sheet) => `[${sheet.pcName}#${sheet.id}]／${sheet.plName}さん`)
        .join("、");
    }

    function buildRichOutput(participants) {
      return `日付
\`\`\`
${sessionInfo.date}
\`\`\`
シナリオタイトル
\`\`\`
${sessionInfo.scenarioTitle}
\`\`\`
成長点
\`\`\`
${sessionInfo.growthPoint}
\`\`\`
ゴールド
\`\`\`
${sessionInfo.gold}
\`\`\`
GM
\`\`\`
${sessionInfo.gmName}
\`\`\`
参加者
\`\`\`
${participants}
\`\`\``;
    }

    function buildGuildMemberNote(sheets) {
      return sheets
        .map((sheet) => {
          const payment = getGuildPayment(sheet);
          return `${sheet.pcName}(${sheet.level}${payment ? `+${payment}` : ""})`;
        })
        .join("、");
    }

    function getGuildPayment(sheet, level = sheet.level) {
      const value = String(sheet.guildPayment ?? sheet.level);
      const max = Number(level) || 0;
      if (!/^\d+$/.test(value) || !Number.isSafeInteger(Number(value)) || Number(value) > max) {
        throw new Error(`${sheet.pcName}の上納は0〜${max}の整数で入力してください。`);
      }
      return Number(value);
    }

    function getGuildGrowthPoint(sheets) {
      return sheets.reduce((total, sheet) => total + (Number(sheet.level) || 0) + getGuildPayment(sheet), 0);
    }

    function buildGuildOutput() {
      const guildMembers = loadedSheets.filter((sheet) => sheet.guildEnabled);
      return `${sessionInfo.date}「${sessionInfo.scenarioTitle}」${buildGuildMemberNote(guildMembers)}`;
    }

    function buildGuildYtsheetFields() {
      const guildMembers = loadedSheets.filter((sheet) => sheet.guildEnabled);
      const growthPoint = getGuildGrowthPoint(guildMembers);
      const participants = guildMembers.map((sheet) => `[${sheet.pcName}#${sheet.id}]`).join("、");
      return {
        date: sessionInfo.date,
        title: sessionInfo.scenarioTitle,
        growthPoint,
        gmName: sessionInfo.gmName,
        participants,
        note: buildGuildMemberNote(guildMembers),
      };
    }

    function updateGuildOutput() {
      if (!guildOutput) {
        return;
      }

      try {
        guildOutput.textContent = buildGuildOutput();
        const fields = buildGuildYtsheetFields();
        guildYtsheetFields.forEach((element) => {
          element.value = fields[element.dataset.guildField];
        });
      } catch (error) {
        guildOutput.textContent = "";
        guildYtsheetFields.forEach((element) => { element.value = ""; });
        status.className = "status error";
        status.textContent = error.message;
      }
      updateBulkJson();
    }

    // APIの保存値は既にHTMLエスケープ済み。既存値は戻さず、新しい履歴だけ同じ形式にする。
    function escapeSheetText(value) {
      const entities = { "&": "&amp;", '"': "&quot;", "<": "&lt;", ">": "&gt;" };
      return String(value).replace(/[&"<>]/g, (character) => entities[character]);
    }

    function decodeSheetText(value) {
      const entities = { "&amp;": "&", "&quot;": '"', "&lt;": "<", "&gt;": ">" };
      return String(value || "").replace(/&(?:amp|quot|lt|gt);/g, (entity) => entities[entity]);
    }

    function appendSessionHistory(source, fields) {
      const data = structuredClone(source);
      let lastRow = 0;
      for (const [key, value] of Object.entries(data)) {
        const match = key.match(/^history(\d+)[A-Z]/);
        if (match && value !== "" && value != null) {
          lastRow = Math.max(lastRow, Number(match[1]));
        }
      }
      const count = Number(data.historyNum || 0);
      if (!Number.isSafeInteger(count) || count < 0 || count > 100000 || !Number.isSafeInteger(lastRow) || lastRow > 100000) {
        throw new Error("セッション履歴の行番号を確認できませんでした。");
      }
      const index = lastRow + 1;
      data.historyNum = String(Math.max(count, index));
      for (const [key, value] of Object.entries(fields)) {
        data[`history${index}${key}`] = escapeSheetText(value);
      }
      // シートの内容を保持し、認証・リクエスト用パラメーターだけは持ち出さない。
      for (const key of ["id", "pass", "_token", "mode", "IP", "registerkey", "base64mode"]) {
        delete data[key];
      }
      return { data, index };
    }

    function refreshBulkCandidates() {
      bulkRequestId += 1;
      bulkSource = null;
      bulkJsonSection.hidden = loadedSheets.length === 0;
      bulkJsonCandidates.replaceChildren();
      loadedSheets.filter((sheet) => sheet.guildEnabled).forEach((sheet) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "secondary";
        button.textContent = sheet.pcName;
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", () => loadBulkJson(sheet, button));
        bulkJsonCandidates.append(button);
      });
      updateBulkJson();
    }

    function updateBulkJson() {
      bulkPcJson = "";
      bulkGuildJson = "";
      bulkJsonPreview.hidden = true;
      bulkJsonPreview.textContent = "";
      bulkJsonStatus.className = "status";
      bulkJsonStatus.textContent = bulkJsonCandidates.children.length
        ? "PCを選ぶと、PCと所属ギルドの最新データを読み込みます。"
        : "PCの「ギルド」を選択してください。";
      const source = bulkSource;
      try {
        if (source?.pcData) {
          const selected = loadedSheets.filter((sheet) => sheet.guildEnabled);
          const levels = selected.map((sheet) => sheet === source.sheet ? source.pcData.level : sheet.level);
          if (!levels.every((level) => /^\d+$/.test(String(level)) && Number.isSafeInteger(Number(level)) && Number(level) > 0)) {
            throw new Error("ギルドを選択したPCのCLを確認して、PCを読み込み直してください。");
          }
          selected.forEach((sheet, index) => getGuildPayment(sheet, levels[index]));
          const pc = appendSessionHistory(source.pcData, {
            Date: sessionInfo.date,
            Title: sessionInfo.scenarioTitle,
            Exp: sessionInfo.growthPoint || "0",
            Payment: getGuildPayment(source.sheet, source.pcData.level) || "",
            Money: sessionInfo.gold || "0",
            Gm: sessionInfo.gmName,
            Member: buildParticipantOutput(loadedSheets),
            Note: "",
          });
          bulkPcJson = JSON.stringify(pc.data);
          const preview = [
            `PC：${source.sheet.pcName}（履歴${pc.index}）`,
            `${sessionInfo.date}「${sessionInfo.scenarioTitle}」／GM：${sessionInfo.gmName}`,
            `成長点：${sessionInfo.growthPoint || 0}／上納：${getGuildPayment(source.sheet, source.pcData.level)}／ゴールド：${sessionInfo.gold || 0}`,
          ];
          if (source.guildData) {
            const members = selected.map((sheet, index) => ({ ...sheet, level: levels[index] }));
            const growthPoint = getGuildGrowthPoint(members);
            const guild = appendSessionHistory(source.guildData, {
              Date: sessionInfo.date,
              Title: sessionInfo.scenarioTitle,
              Exp: growthPoint,
              Gm: sessionInfo.gmName,
              Member: members.map((sheet) => `[${sheet.pcName}#${sheet.id}]`).join("、"),
              Note: buildGuildMemberNote(members),
            });
            guild.data.type = "g";
            bulkGuildJson = JSON.stringify(guild.data);
            preview.push(`ギルド：${decodeSheetText(source.guildData.guildName)}（履歴${guild.index}）／成長点：${growthPoint}`);
          }
          bulkJsonPreview.textContent = preview.join("\n");
          bulkJsonPreview.hidden = false;
          bulkJsonStatus.textContent = "今回のセッション履歴を追加しました。各JSONをコピーできます。";
        }
        if (source?.loading) {
          bulkJsonStatus.textContent = `${source.sheet.pcName}と所属ギルドを読み込み中…`;
        } else if (source?.error) {
          bulkJsonStatus.className = "status error";
          bulkJsonStatus.textContent = source.error + (bulkPcJson ? " PCのJSONはコピーできます。" : "");
        }
      } catch (error) {
        bulkJsonStatus.className = "status error";
        bulkJsonStatus.textContent = error.message;
      }
      copyBulkPcJsonButton.disabled = !bulkPcJson || Boolean(source?.loading);
      copyBulkGuildJsonButton.disabled = !bulkGuildJson || Boolean(source?.loading);
    }

    async function loadBulkJson(sheet, button) {
      const requestId = ++bulkRequestId;
      bulkSource = { sheet, pcData: null, guildData: null, loading: true, error: "" };
      [...bulkJsonCandidates.children].forEach((candidate) => {
        candidate.classList.toggle("primary", candidate === button);
        candidate.classList.toggle("secondary", candidate !== button);
        candidate.setAttribute("aria-pressed", String(candidate === button));
      });
      updateBulkJson();
      try {
        const pcData = await fetchSheetData(sheet.sheetUrl);
        if (requestId !== bulkRequestId) return;
        if (pcData.type === "g" || !(pcData.characterName || pcData.aka)) {
          throw new Error("PCのキャラクターシートを取得できませんでした。");
        }
        bulkSource.pcData = pcData;
        if (!pcData.guildURL || !String(pcData.guildURL).trim()) {
          throw new Error("このPCのギルドシートURLが未設定です。PCシートで設定してから選び直してください。");
        }
        const guildUrl = normalizeSheetUrl(decodeSheetText(pcData.guildURL), sheet.sheetUrl);
        const guildData = await fetchSheetData(guildUrl);
        if (requestId !== bulkRequestId) return;
        if (!guildData.guildName || guildData.characterName || (guildData.type && guildData.type !== "g")) {
          throw new Error("リンク先はギルドシートではありません。PCのギルドシートURLを確認してください。");
        }
        bulkSource.guildData = guildData;
      } catch (error) {
        if (requestId !== bulkRequestId) return;
        bulkSource.error = error.message;
      } finally {
        if (requestId === bulkRequestId) {
          bulkSource.loading = false;
          updateBulkJson();
        }
      }
    }

    async function copyBulkJson(kind) {
      const text = kind === "pc" ? bulkPcJson : bulkGuildJson;
      if (!text || bulkSource?.loading) return;
      const textarea = document.createElement("textarea");
      const focused = document.activeElement;
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.append(textarea);
      try {
        const message = `${kind === "pc" ? "PC" : "ギルド"}のJSONをコピーしました。`;
        await copyTextFromElement(textarea, message);
        bulkJsonStatus.className = "status";
        bulkJsonStatus.textContent = message;
      } catch (error) {
        bulkJsonStatus.className = "status error";
        bulkJsonStatus.textContent = "コピーできませんでした。ブラウザーのクリップボード権限を確認してください。";
      } finally {
        textarea.remove();
        focused?.focus({ preventScroll: true });
      }
    }

    function updateRichOutput() {
      if (!richOutput) {
        return;
      }

      richOutput.textContent = buildRichOutput(output.textContent);
    }

    function buildLogOutput() {
      const players = loadedSheets
        .map((sheet) => `${sheet.plName}さん`)
        .join("、");
      return `${sessionInfo.date}
${sessionInfo.scenarioTitle}
GM：${sessionInfo.gmName}
PL：${players}
一言：`;
    }

    function updateLogOutput() {
      if (!logOutput) {
        return;
      }

      logOutput.textContent = buildLogOutput();
    }

    function setMode(mode) {
      if (currentMode !== mode) {
        modeGmNames[currentMode] = gmNameInput.value;
      }
      currentMode = mode;
      gmNameInput.value = modeGmNames[mode];
      document.body.classList.toggle("mode-gm", mode === "gm");
      document.body.classList.toggle("mode-pl", mode === "pl");
      document.body.classList.toggle("mode-integrated", mode === "integrated");
      document.body.classList.toggle("mode-bulk", mode === "bulk");
      gmModeButton.classList.toggle("active", mode === "gm");
      plModeButton.classList.toggle("active", mode === "pl");
      integratedModeButton.classList.toggle("active", mode === "integrated");
      bulkModeButton.classList.toggle("active", mode === "bulk");
      gmModeButton.setAttribute("aria-pressed", String(mode === "gm"));
      plModeButton.setAttribute("aria-pressed", String(mode === "pl"));
      integratedModeButton.setAttribute("aria-pressed", String(mode === "integrated"));
      bulkModeButton.setAttribute("aria-pressed", String(mode === "bulk"));
      saveSessionInfo();
    }

    function createUrlRow(value = "") {
      const row = document.createElement("div");
      row.className = "url-row";

      const field = document.createElement("div");
      field.className = "field";

      const label = document.createElement("label");
      label.textContent = "ゆとシートURL";

      const input = document.createElement("input");
      input.type = "url";
      input.placeholder = "https://yutorize.work/ytsheet/ar2e/?id=xxxxxx";
      input.value = value;

      urlRowCount += 1;
      label.htmlFor = `sheetUrl-${urlRowCount}`;
      input.id = label.htmlFor;

      const result = document.createElement("div");
      result.className = "sheet-result";
      result.textContent = "未読み込み";

      const resultLine = document.createElement("div");
      resultLine.className = "sheet-result-line";

      const guildToggle = document.createElement("button");
      guildToggle.className = "guild-toggle pl-only";
      guildToggle.type = "button";
      guildToggle.textContent = "ギルド";
      guildToggle.disabled = true;
      guildToggle.setAttribute("aria-pressed", "false");
      const paymentLabel = document.createElement("label");
      paymentLabel.className = "guild-payment pl-only";
      paymentLabel.textContent = "上納";
      paymentLabel.hidden = true;
      const paymentInput = document.createElement("input");
      paymentInput.type = "number";
      paymentInput.min = "0";
      paymentInput.step = "1";
      paymentInput.disabled = true;
      paymentLabel.append(paymentInput);
      paymentInput.addEventListener("input", () => {
        if (!row.sheet) return;
        row.sheet.guildPayment = paymentInput.value;
        status.className = "status";
        status.textContent = "上納を更新しました。";
        updateGuildOutput();
      });
      guildToggle.addEventListener("click", () => {
        const enabled = !row.sheet?.guildEnabled;
        if (!row.sheet) {
          return;
        }

        row.sheet.guildEnabled = enabled;
        guildToggle.classList.toggle("active", enabled);
        guildToggle.setAttribute("aria-pressed", String(enabled));
        paymentLabel.hidden = !enabled;
        paymentInput.disabled = !enabled;
        refreshBulkCandidates();
        updateGuildOutput();
      });

      const removeButton = document.createElement("button");
      removeButton.className = "danger";
      removeButton.type = "button";
      removeButton.textContent = "削除";
      removeButton.addEventListener("click", () => {
        loadedSheets = loadedSheets.filter((sheet) => sheet !== row.sheet);
        row.remove();
        refreshBulkCandidates();
        updateGuildOutput();
        if (!urlList.children.length) {
          createUrlRow();
        }
      });

      input.addEventListener("input", () => {
        if (!row.sheet) return;
        loadedSheets = loadedSheets.filter((sheet) => sheet !== row.sheet);
        row.sheet = null;
        result.className = "sheet-result";
        result.textContent = "URLが変更されました。読み込み直してください。";
        guildToggle.disabled = true;
        guildToggle.classList.remove("active");
        guildToggle.setAttribute("aria-pressed", "false");
        paymentLabel.hidden = true;
        paymentInput.disabled = true;
        refreshBulkCandidates();
        updateGuildOutput();
      });

      resultLine.append(result, guildToggle, paymentLabel);
      field.append(label, input, resultLine);
      row.append(field, removeButton);
      urlList.append(row);
      return input;
    }

    function getSheetId(sheetUrl) {
      const url = new URL(sheetUrl);
      const id = url.searchParams.get("id");
      if (!id) {
        throw new Error("URLからidを取得できませんでした。");
      }
      return id;
    }

    function toJsonUrl(sheetUrl) {
      const url = new URL(sheetUrl);
      url.searchParams.set("mode", "json");
      url.searchParams.delete("callback");
      return url.toString();
    }

    function normalizeSheetUrl(value, base) {
      const url = new URL(value, base);
      if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("シートURLはhttpまたはhttpsで指定してください。");
      }
      const id = getSheetId(url.href);
      url.search = "";
      url.searchParams.set("id", id);
      url.hash = "";
      return url.href;
    }

    async function fetchSheetData(sheetUrl) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(toJsonUrl(sheetUrl), { signal: controller.signal });
        if (!response.ok) {
          throw new Error(`読み込みに失敗しました。HTTP ${response.status}`);
        }
        let data;
        try {
          data = await response.json();
        } catch (error) {
          throw new Error("シートのJSONを取得できませんでした。URLと閲覧権限を確認してください。");
        }
        if (!data || typeof data !== "object" || Array.isArray(data)) {
          throw new Error("シートのJSON形式を確認できませんでした。");
        }
        if (data.result && data.result !== "OK") {
          throw new Error(data.message || data.result);
        }
        return data;
      } catch (error) {
        if (error.name === "AbortError") throw new Error("読み込みがタイムアウトしました。もう一度選択してください。");
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    function normalizeGuildName(guildName) {
      if (!guildName) {
        return "未所属";
      }

      const text = String(guildName).trim();
      const linkedName = text.match(/^\[\[(.+?)(?:&gt;|>).*?\]\]$/);
      return linkedName ? linkedName[1].trim() || "未所属" : text;
    }

    async function loadSheet(sheetUrl) {
      sheetUrl = normalizeSheetUrl(sheetUrl);
      const id = getSheetId(sheetUrl);
      const data = await fetchSheetData(sheetUrl);
      if (data.type === "g" || !(data.characterName || data.aka)) {
        throw new Error("PCのキャラクターシートURLを入力してください。");
      }
      return {
        id,
        sheetUrl,
        pcName: decodeSheetText(data.characterName || data.aka),
        plName: decodeSheetText(data.playerName) || "PL名未設定",
        guildName: normalizeGuildName(decodeSheetText(data.guildName)),
        level: data.level || "CL未設定",
        guildPayment: Number(data.level) || 0,
        guildEnabled: false,
      };
    }

    async function loadSheets() {
      saveSessionInfo();

      const rows = [...urlList.querySelectorAll(".url-row")];
      const entries = rows
        .map((row) => ({
          row,
          input: row.querySelector("input"),
          sheetUrl: row.querySelector("input").value.trim(),
          result: row.querySelector(".sheet-result"),
        }))
        .filter((entry) => entry.input.value.trim());

      status.className = "status";
      output.textContent = "";
      loadedSheets = [];
      refreshBulkCandidates();
      updateGuildOutput();
      updateRichOutput();
      updateLogOutput();
      rows.forEach((row) => {
        const result = row.querySelector(".sheet-result");
        const guildToggle = row.querySelector(".guild-toggle");
        const paymentLabel = row.querySelector(".guild-payment");
        paymentLabel.hidden = true;
        paymentLabel.querySelector("input").disabled = true;
        row.sheet = null;
        result.className = "sheet-result";
        result.textContent = row.querySelector("input").value.trim() ? "読み込み待ち" : "未入力";
        guildToggle.disabled = true;
        guildToggle.classList.remove("active");
        guildToggle.setAttribute("aria-pressed", "false");
      });

      if (!entries.length) {
        status.textContent = "ゆとシートURLを1件以上入力してください。";
        status.classList.add("error");
        return;
      }

      loadSheetsButton.disabled = true;
      loadSheetsInlineButton.disabled = true;
      status.textContent = "読み込み中...";

      try {
        const results = await Promise.allSettled(
          entries.map((entry) => loadSheet(entry.sheetUrl))
        );
        const sheets = [];

        results.forEach((result, index) => {
          const entry = entries[index];
          if (!entry.row.isConnected || entry.input.value.trim() !== entry.sheetUrl) {
            return;
          }
          if (result.status === "fulfilled") {
            const sheet = result.value;
            sheets.push(sheet);
            entry.row.sheet = sheet;
            const guildToggle = entry.row.querySelector(".guild-toggle");
            const paymentInput = entry.row.querySelector(".guild-payment input");
            paymentInput.max = String(Number(sheet.level) || 0);
            paymentInput.value = String(sheet.guildPayment);
            paymentInput.setAttribute("aria-label", `${sheet.pcName}の上納`);
            guildToggle.disabled = false;
            guildToggle.classList.remove("active");
            guildToggle.setAttribute("aria-pressed", "false");
            entry.result.className = "sheet-result loaded";
            entry.result.textContent = `PC名: ${sheet.pcName} ／ PL名: ${sheet.plName} ／ CL: ${sheet.level} ／ 所属ギルド: ${sheet.guildName}`;
          } else {
            entry.result.className = "sheet-result error";
            entry.result.textContent = result.reason.message;
          }
        });

        loadedSheets = sheets;
        refreshBulkCandidates();
        output.textContent = buildParticipantOutput(sheets);
        updateGuildOutput();
        updateRichOutput();
        updateLogOutput();
        const failedCount = results.length - sheets.length;
        status.textContent = failedCount
          ? `${sheets.length}件読み込み、${failedCount}件失敗しました。`
          : `${sheets.length}件読み込みました。`;
        status.classList.toggle("error", failedCount > 0);
      } catch (error) {
        status.textContent = error.message;
        status.classList.add("error");
      } finally {
        loadSheetsButton.disabled = false;
        loadSheetsInlineButton.disabled = false;
      }
    }

    async function copyTextFromElement(element, message) {
      const text = "value" in element ? element.value : element.textContent;

      if (!text) {
        return;
      }

      if (navigator.clipboard) {
        await navigator.clipboard.writeText(text);
      } else {
        const range = document.createRange();
        const selection = window.getSelection();
        let copied;
        if ("select" in element) {
          element.select();
          copied = document.execCommand("copy");
        } else {
          range.selectNodeContents(element);
          selection.removeAllRanges();
          selection.addRange(range);
          copied = document.execCommand("copy");
          selection.removeAllRanges();
        }
        if (!copied) throw new Error("コピーに失敗しました。");
      }
      status.className = "status";
      status.textContent = message;
    }

    addUrlButton.addEventListener("click", () => createUrlRow().focus());
    loadSheetsButton.addEventListener("click", loadSheets);
    loadSheetsInlineButton.addEventListener("click", loadSheets);
    copyOutputButton.addEventListener("click", () => copyTextFromElement(output, "出力をコピーしました。"));
    copyGuildOutputButton.addEventListener("click", () => copyTextFromElement(guildOutput, "ギルド出力（保管所）をコピーしました。"));
    copyRichOutputButton.addEventListener("click", () => copyTextFromElement(richOutput, "リッチな出力をコピーしました。"));
    copyLogOutputButton.addEventListener("click", () => copyTextFromElement(logOutput, "ログ集積所をコピーしました。"));
    saveGmNameButton.addEventListener("click", saveGmName);
    copySessionFieldButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const target = document.querySelector(`#${button.dataset.copyTarget}`);
        const label = button.parentElement.parentElement.querySelector("label").textContent;
        copyTextFromElement(target, `${label}をコピーしました。`);
      });
    });
    gmModeButton.addEventListener("click", () => setMode("gm"));
    plModeButton.addEventListener("click", () => setMode("pl"));
    integratedModeButton.addEventListener("click", () => setMode("integrated"));
    bulkModeButton.addEventListener("click", () => setMode("bulk"));
    copyBulkPcJsonButton.addEventListener("click", () => copyBulkJson("pc"));
    copyBulkGuildJsonButton.addEventListener("click", () => copyBulkJson("guild"));
    [scenarioTitleInput, sessionDateInput, gmNameInput, growthPointInput, goldInput]
      .forEach((input) => input.addEventListener("input", saveSessionInfo));

    sessionDateInput.value = getJapanDateString();
    modeGmNames.gm = loadSavedGmName();
    modeGmNames.pl = "";
    modeGmNames.integrated = "";
    setMode("gm");

    for (let index = 0; index < 4; index += 1) {
      createUrlRow();
    }
  </script>
</body>

</html>
